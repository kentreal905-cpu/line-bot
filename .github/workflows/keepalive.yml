# Render の無料プランは15分アクセスが無いとサーバーを止める。
# 起き上がりに10〜15秒かかり、その間 LINE の Webhook はタイムアウトするため、
# 「最初に話しかけた人だけ無反応」という状態になる。
#
# ⚠️ 定期実行は止めた（2026-09-26）。
# GitHub Actions のスケジュールは混雑時に大幅に遅延・間引きされ、
# `*/10` と書いても実際は2〜5時間おきにしか動いていなかった
# （9/24〜25 の実行: 10:28 → 15:26 → 19:24 → 22:37 → 00:47）。
# その空白でサーバーが寝て、最初の人が無反応になる症状が再発した。
#
# いまは **UptimeRobot が5分おきに /health を叩いている**（無料プラン）。
# こちらは間隔が守られるので、スリープに入らない。
# 監視先: https://line-bot-6vfl.onrender.com/health
#
# このワークフローは、UptimeRobot が止まったときの手動の予備として残してある。
name: keepalive

on:
  workflow_dispatch:        # 手動のときだけ動く

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: サーバーを起こす
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -m 60 -o /dev/null -w "%{http_code}" \
              https://line-bot-6vfl.onrender.com/health) && break
            echo "リトライ $i"
            sleep 10
          done
          echo "HTTP $code"
          test "$code" = "200"
